---
grafana_version: "13.2.4"
grafana_stack_name: grafana

# Incrementer pour publier un nouveau contenu de secret (un secret Docker est immuable)
grafana_secrets_version: 1

# Placement : épinglé car le volume (plugins) est local à ce nœud
grafana_node: swarm-mgr01

# Port public HTTPS (reseau ingress Swarm)
grafana_https_port: 3000

# Adresse publique de Grafana (liens, redirections, notifications d'alertes)
grafana_root_url: "https://172.27.248.110:{{ grafana_https_port }}/"

# HTTPS : certificat de la CA interne (secrets Swarm créés hors Ansible)
grafana_tls_cert_secret: infra_tls_crt_20290113
grafana_tls_key_secret: infra_tls_key_20290113

# Base de données
grafana_db_host: ""
grafana_db_port: 5432
grafana_db_name: grafana
grafana_db_user: grafana

# Envoi d'emails (alertes) via le relais SMTP Google Workspace, autorisé par IP
grafana_smtp_host: "smtp-relay.gmail.com:587"
grafana_smtp_from_address: supervision@example.com
grafana_smtp_from_name: Supervision Example
grafana_smtp_ehlo_identity: example.com

# Secrets propres à l'environnement : à définir dans l'inventaire
grafana_db_password: ""
grafana_admin_password: ""

# Plugins installés au démarrage (GF_PLUGINS_PREINSTALL_SYNC), versions épinglées
grafana_plugins_preinstall:
  - "alexanderzobnin-zabbix-app@6.9.1"
