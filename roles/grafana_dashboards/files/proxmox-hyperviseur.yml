# Dashboard Proxmox (hôte + ZFS, métriques node_exporter via Alloy) - maintenu dans Git, déployé par Ansible
uid: infra-proxmox
title: Proxmox - Hyperviseur
tags: [infra, proxmox, zfs]
timezone: browser
editable: true
schemaVersion: 39
refresh: 1m
time: {from: now-6h, to: now}

templating:
  list:
    - name: datasource
      label: Datasource
      type: datasource
      query: prometheus
    - name: instance
      label: Hôte
      type: query
      datasource: {type: prometheus, uid: "${datasource}"}
      definition: label_values(node_zfs_zpool_state, instance)
      query: label_values(node_zfs_zpool_state, instance)
      refresh: 1
      sort: 1

panels:
  # --- Ligne 1 : état et chiffres clés ---
  - id: 1
    type: table
    title: État des pools ZFS
    gridPos: {x: 0, y: 0, w: 8, h: 6}
    datasource: {type: prometheus, uid: "${datasource}"}
    targets:
      - refId: A
        instant: true
        format: table
        expr: node_zfs_zpool_state{instance="$instance"} == 1
    transformations:
      - id: organize
        options:
          excludeByName: {Time: true, Value: true, __name__: true, instance: true, job: true}
          renameByName: {zpool: Pool, state: État}
    fieldConfig:
      defaults: {}
      overrides:
        - matcher: {id: byName, options: État}
          properties:
            - id: custom.cellOptions
              value: {type: color-background}
            - id: mappings
              value:
                - type: value
                  options:
                    online: {text: ONLINE, color: green, index: 0}
                    degraded: {text: DEGRADED, color: red, index: 1}
                    faulted: {text: FAULTED, color: red, index: 2}
                    unavail: {text: UNAVAIL, color: red, index: 3}
                    suspended: {text: SUSPENDED, color: red, index: 4}
                    offline: {text: OFFLINE, color: orange, index: 5}
                    removed: {text: REMOVED, color: orange, index: 6}

  - id: 2
    type: stat
    title: Pools non ONLINE
    description: Nombre de pools ZFS dans un autre état que ONLINE. Doit être à 0.
    gridPos: {x: 8, y: 0, w: 4, h: 6}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig:
      defaults:
        unit: none
        thresholds:
          mode: absolute
          steps: [{color: green, value: null}, {color: red, value: 1}]
      overrides: []
    targets:
      - refId: A
        expr: count(node_zfs_zpool_state{instance="$instance", state!="online"} == 1) or vector(0)

  - id: 3
    type: stat
    title: Uptime
    gridPos: {x: 12, y: 0, w: 4, h: 6}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig: {defaults: {unit: dtdurations, color: {mode: fixed, fixedColor: text}}, overrides: []}
    targets:
      - refId: A
        expr: time() - node_boot_time_seconds{instance="$instance"}

  - id: 4
    type: stat
    title: CPU utilisé
    gridPos: {x: 16, y: 0, w: 4, h: 6}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        thresholds:
          mode: absolute
          steps: [{color: green, value: null}, {color: orange, value: 70}, {color: red, value: 90}]
      overrides: []
    targets:
      - refId: A
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{instance="$instance", mode="idle"}[$__rate_interval])))

  - id: 5
    type: stat
    title: RAM utilisée
    description: Inclut le cache ZFS (ARC), que ZFS libère quand les VM ont besoin de mémoire.
    gridPos: {x: 20, y: 0, w: 4, h: 6}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        thresholds:
          mode: absolute
          steps: [{color: green, value: null}, {color: orange, value: 85}, {color: red, value: 95}]
      overrides: []
    targets:
      - refId: A
        expr: 100 * (1 - node_memory_MemAvailable_bytes{instance="$instance"} / node_memory_MemTotal_bytes{instance="$instance"})

  # --- Ligne 2 : disques physiques ---
  - id: 6
    type: timeseries
    title: Occupation des disques physiques
    description: "Part du temps où chaque disque traite des E/S. Proche de 100 %, le disque est saturé. D'après les tailles vues dans lsblk : sdc à sdf = Pool-HDD, sdg et sdh = rpool, sda et sdb = 954 Go."
    gridPos: {x: 0, y: 6, w: 12, h: 8}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig: {defaults: {unit: percent, min: 0, max: 100}, overrides: []}
    targets:
      - refId: A
        expr: 100 * rate(node_disk_io_time_seconds_total{instance="$instance", device=~"sd[a-z]+"}[$__rate_interval])
        legendFormat: "{{device}}"

  - id: 7
    type: timeseries
    title: Latence moyenne des disques
    gridPos: {x: 12, y: 6, w: 12, h: 8}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig: {defaults: {unit: s, min: 0}, overrides: []}
    targets:
      - refId: A
        expr: rate(node_disk_read_time_seconds_total{instance="$instance", device=~"sd[a-z]+"}[$__rate_interval]) / rate(node_disk_reads_completed_total{instance="$instance", device=~"sd[a-z]+"}[$__rate_interval])
        legendFormat: "{{device}} lecture"
      - refId: B
        expr: rate(node_disk_write_time_seconds_total{instance="$instance", device=~"sd[a-z]+"}[$__rate_interval]) / rate(node_disk_writes_completed_total{instance="$instance", device=~"sd[a-z]+"}[$__rate_interval])
        legendFormat: "{{device}} écriture"

  # --- Ligne 3 : cache ZFS ---
  - id: 8
    type: timeseries
    title: Cache ZFS (ARC) - taille
    gridPos: {x: 0, y: 14, w: 12, h: 8}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig: {defaults: {unit: bytes, min: 0}, overrides: []}
    targets:
      - refId: A
        expr: node_zfs_arc_size{instance="$instance"}
        legendFormat: Taille utilisée
      - refId: B
        expr: node_zfs_arc_c_max{instance="$instance"}
        legendFormat: Taille maximale

  - id: 9
    type: timeseries
    title: Cache ZFS (ARC) - taux de réussite
    description: Part des lectures servies depuis la RAM. Plus il est bas, plus ZFS lit sur les disques.
    gridPos: {x: 12, y: 14, w: 12, h: 8}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig: {defaults: {unit: percent, min: 0, max: 100}, overrides: []}
    targets:
      - refId: A
        expr: 100 * rate(node_zfs_arc_hits{instance="$instance"}[$__rate_interval]) / (rate(node_zfs_arc_hits{instance="$instance"}[$__rate_interval]) + rate(node_zfs_arc_misses{instance="$instance"}[$__rate_interval]))
        legendFormat: Taux de réussite

  # --- Ligne 4 : CPU et mémoire de l'hôte ---
  - id: 10
    type: timeseries
    title: CPU de l'hôte par mode (hors idle)
    gridPos: {x: 0, y: 22, w: 12, h: 8}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        custom: {stacking: {mode: normal}, fillOpacity: 30}
      overrides: []
    targets:
      - refId: A
        expr: 100 * avg by (mode) (rate(node_cpu_seconds_total{instance="$instance", mode!="idle"}[$__rate_interval]))
        legendFormat: "{{mode}}"

  - id: 11
    type: timeseries
    title: Mémoire de l'hôte
    gridPos: {x: 12, y: 22, w: 12, h: 8}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig: {defaults: {unit: bytes, min: 0}, overrides: []}
    targets:
      - refId: A
        expr: node_memory_MemTotal_bytes{instance="$instance"}
        legendFormat: Totale
      - refId: B
        expr: node_memory_MemTotal_bytes{instance="$instance"} - node_memory_MemAvailable_bytes{instance="$instance"}
        legendFormat: Utilisée
      - refId: C
        expr: node_zfs_arc_size{instance="$instance"}
        legendFormat: dont cache ZFS (ARC)

  # --- Ligne 5 : réseau des bridges ---
  - id: 12
    type: timeseries
    title: Réseau des bridges Proxmox (vmbr)
    gridPos: {x: 0, y: 30, w: 24, h: 8}
    datasource: {type: prometheus, uid: "${datasource}"}
    fieldConfig: {defaults: {unit: Bps}, overrides: []}
    targets:
      - refId: A
        expr: rate(node_network_receive_bytes_total{instance="$instance", device=~"vmbr.*"}[$__rate_interval])
        legendFormat: "{{device}} reçu"
      - refId: B
        expr: rate(node_network_transmit_bytes_total{instance="$instance", device=~"vmbr.*"}[$__rate_interval])
        legendFormat: "{{device}} envoyé"
