---
- name: Vérifier que les paramètres obligatoires sont définis
  ansible.builtin.assert:
    that:
      - jumpserver_db_host | length > 0
      - jumpserver_db_password | length > 0
      - jumpserver_secret_key | length > 0
      - jumpserver_bootstrap_token | length > 0
      - jumpserver_redis_password | length > 0
      - jumpserver_domains | length > 0
    quiet: true
  no_log: true

- name: Installer les bibliothèques Python requises par community.docker
  ansible.builtin.apt:
    name:
      - python3-docker
      - python3-jsondiff
    state: present

- name: Créer les dossiers de données sur les nœuds concernés
  ansible.builtin.file:
    path: "{{ jumpserver_data_root }}/{{ item.dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - { node: "{{ jumpserver_node_core }}", dir: core }
    - { node: "{{ jumpserver_node_connectors }}", dir: koko }
    - { node: "{{ jumpserver_node_connectors }}", dir: lion }
    - { node: "{{ jumpserver_node_connectors }}", dir: chen }
  delegate_to: "{{ item.node }}"

- name: Créer les Docker secrets depuis Vault
  community.docker.docker_secret:
    name: "{{ item.name }}_v{{ jumpserver_secrets_version }}"
    data: "{{ lookup('ansible.builtin.template', item.template) }}"
    state: present
  loop:
    - { name: jms_core_config, template: core-config.yml.j2 }
    - { name: jms_redis_config, template: redis.conf.j2 }
  loop_control:
    label: "{{ item.name }}_v{{ jumpserver_secrets_version }}"
  no_log: true

- name: Créer la config Docker nginx HTTPS du service web
  community.docker.docker_config:
    name: "jms_web_https_conf_v{{ jumpserver_web_https_conf_version }}"
    data: "{{ lookup('ansible.builtin.template', 'https_server.conf.j2') }}"
    state: present

- name: Controler que le fichier de stack se genere (affiche uniquement les services)
  ansible.builtin.debug:
    msg: "{{ (lookup('ansible.builtin.template', 'jumpserver-stack.yml.j2') | from_yaml).services.keys() | list }}"
- name: Valider la stack avec la CLI Docker (exécuté aussi en --check)
  block:
    - name: Créer un fichier temporaire pour la stack rendue
      ansible.builtin.tempfile:
        state: file
        suffix: .jms-stack.yml
      register: jms_stack_tmp
      check_mode: false
      changed_when: false

    - name: Rendre la stack dans le fichier temporaire
      ansible.builtin.template:
        src: jumpserver-stack.yml.j2
        dest: "{{ jms_stack_tmp.path }}"
        mode: "0600"
      check_mode: false
      changed_when: false
      no_log: true

    - name: Faire valider la stack par docker stack config
      ansible.builtin.shell:
        cmd: docker stack config -c {{ jms_stack_tmp.path }} > /dev/null
      changed_when: false
      check_mode: false

  always:
    - name: Supprimer le fichier temporaire
      ansible.builtin.file:
        path: "{{ jms_stack_tmp.path }}"
        state: absent
      check_mode: false
      changed_when: false
      when: jms_stack_tmp.path is defined
- name: Deployer la stack
  community.docker.docker_stack:
    name: "{{ jumpserver_stack_name }}"
    compose:
      - "{{ lookup('ansible.builtin.template', 'jumpserver-stack.yml.j2') | from_yaml }}"
    state: present
    resolve_image: changed
  no_log: true
