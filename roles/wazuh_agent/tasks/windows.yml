- name: Installer l'agent Wazuh (MSI, version épinglée)
  ansible.windows.win_package:
    path: "{{ wazuh_agent_msi_url }}"
    arguments: "WAZUH_MANAGER={{ wazuh_manager_address }}"
    creates_service: WazuhSvc
    state: present

- name: Définir l'adresse du manager
  community.windows.win_lineinfile:
    path: C:\Program Files (x86)\ossec-agent\ossec.conf
    regexp: '^\s*<address>'
    line: "      <address>{{ wazuh_manager_address }}</address>"
  notify: Redémarrer WazuhSvc

- name: Activer et démarrer l'agent Wazuh
  ansible.windows.win_service:
    name: WazuhSvc
    start_mode: auto
    state: started
