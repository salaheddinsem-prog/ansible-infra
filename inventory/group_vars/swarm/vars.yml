# Le zabbix-server qui interroge l'agent de son propre noeud arrive
# avec son IP docker_gwbridge (pas de SNAT pour un trafic local).
# Elargit la surface : tout conteneur du noeud attache a docker_gwbridge
# peut interroger l'agent (system.run reste refuse par defaut).
zabbix_agent2_extra_servers:
  - 172.18.0.0/16

# JumpServer
jumpserver_db_host: 172.27.248.150
jumpserver_db_password: "{{ hostvars['bdd-srv'].vault_jumpserver_db_password }}"
jumpserver_secret_key: "{{ vault_jumpserver_secret_key }}"
jumpserver_bootstrap_token: "{{ vault_jumpserver_bootstrap_token }}"
jumpserver_redis_password: "{{ vault_jumpserver_redis_password }}"
jumpserver_domains: "172.27.248.110:8082,172.27.248.111:8082,172.27.248.112:8082,172.27.248.110:8444,172.27.248.111:8444,172.27.248.112:8444"
# Grafana
grafana_db_host: 172.27.248.150
grafana_db_password: "{{ hostvars['bdd-srv'].vault_grafana_db_password }}"
grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Prometheus
prometheus_basic_auth_users:
  grafana: "{{ vault_prometheus_grafana_password_hash }}"
  alloy: "{{ vault_prometheus_alloy_password_hash }}"
